# --- Cluster RabbitMQ de 2 nodos (EP3) --------------------------------------
# Peer discovery: cada nodo busca el nodo semilla "rabbit@rabbitmq-node1" y
# se une al cluster de forma automatica al arrancar (sin comandos manuales).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-node1
# Revisa periodicamente si hay nodos "muertos" en el cluster y los limpia.
cluster_formation.node_cleanup.interval = 10
# Si un nodo se cae, el otro recupera automaticamente la particion.
cluster_partition_handling = autoheal

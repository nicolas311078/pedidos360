services:
  db:
    image: postgres:16-alpine
    container_name: pedidos360-db
    environment:
      POSTGRES_DB: ${DB_NAME:-users_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq-node1:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-node1
    hostname: rabbitmq-node1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-node1
      # Cookie de Erlang compartida: es lo que permite que node2 se una al cluster.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-node1-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  rabbitmq-node2:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-node2
    hostname: rabbitmq-node2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-node2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cluster-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-node2-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
    # Se une al cluster del node1 solo, con peer discovery (docker/rabbitmq/rabbitmq.conf).
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  # ---------------- Kafka + Zookeeper (EP5) ---------------------------------
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: >-
        zookeeper-1:2888:3888;
        zookeeper-2:2888:3888;
        zookeeper-3:2888:3888
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-log:/var/lib/zookeeper/log

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: >-
        zookeeper-1:2888:3888;
        zookeeper-2:2888:3888;
        zookeeper-3:2888:3888
    volumes:
      - zookeeper-2-data:/var/lib/zookeeper/data
      - zookeeper-2-log:/var/lib/zookeeper/log

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: >-
        zookeeper-1:2888:3888;
        zookeeper-2:2888:3888;
        zookeeper-3:2888:3888
    volumes:
      - zookeeper-3-data:/var/lib/zookeeper/data
      - zookeeper-3-log:/var/lib/zookeeper/log

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-1:29092,
        EXTERNAL://localhost:9092
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-2:29092,
        EXTERNAL://localhost:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9093:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-3:29092,
        EXTERNAL://localhost:9094
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9094:9092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8085:8080"

  ms-pedidos360-users:
    build:
      context: ./ms-pedidos360-users
    container_name: ms-pedidos360-users
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-node1:
        condition: service_healthy
      kafka-1:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?se requiere JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?se requiere AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?se requiere AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?se requiere AZURE_TENANT_ID}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/azure}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      SPA_BASE_URL: ${SPA_BASE_URL:-http://localhost:4200}
      RABBITMQ_HOST: rabbitmq-node1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      MESSAGING_DLQ_MONITOR_ENABLED: ${MESSAGING_DLQ_MONITOR_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      KAFKA_CREATED_TOPIC: pedidos.creados.v1
      KAFKA_STATUS_TOPIC: pedidos.estados.v1
      KAFKA_CREATED_GROUP: pedidos-created-group
      KAFKA_STATUS_GROUP: pedidos-status-group
      KAFKA_LOAD_TEST_ENABLED: ${KAFKA_LOAD_TEST_ENABLED:-false}
      KAFKA_LOAD_TEST_TOPIC: ${KAFKA_LOAD_TEST_TOPIC:-demo-estres-topic}
    ports:
      - "8083:8083"

  ms-pedidos360-catalog:
    build:
      context: ./ms-pedidos360-catalog
    container_name: ms-pedidos360-catalog
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: catalog_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8081:8081"

  ms-pedidos360-orders:
    build:
      context: ./ms-pedidos360-orders
    container_name: ms-pedidos360-orders
    depends_on:
      db:
        condition: service_healthy
      ms-pedidos360-catalog:
        condition: service_started
      rabbitmq-node1:
        condition: service_healthy
      kafka-1:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: orders_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CATALOG_URL: http://ms-pedidos360-catalog:8081
      RABBITMQ_HOST: rabbitmq-node1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      MESSAGING_DLQ_MONITOR_ENABLED: ${MESSAGING_DLQ_MONITOR_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      KAFKA_CREATED_TOPIC: pedidos.creados.v1
      KAFKA_STATUS_TOPIC: pedidos.estados.v1
      KAFKA_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 3
      KAFKA_LOAD_TEST_ENABLED: ${KAFKA_LOAD_TEST_ENABLED:-false}
      KAFKA_LOAD_TEST_TOPIC: ${KAFKA_LOAD_TEST_TOPIC:-demo-estres-topic}
      KAFKA_LOAD_TEST_GROUP: ${KAFKA_LOAD_TEST_GROUP:-demo-estres-slow-consumer}
      KAFKA_LOAD_TEST_DELAY_MS: ${KAFKA_LOAD_TEST_DELAY_MS:-10}
    ports:
      - "8082:8082"


  ms-pedidos360-messaging-admin:
    build:
      context: ./ms-pedidos360-messaging-admin
    container_name: ms-pedidos360-messaging-admin
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
      kafka-1:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq-node1:15672
      RABBITMQ_MANAGEMENT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_MANAGEMENT_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      RABBITMQ_VHOST: /
    ports:
      - "8084:8084"

  ms-pedidos360-bff:
    build:
      context: ./ms-pedidos360-bff
    container_name: ms-pedidos360-bff
    depends_on:
      ms-pedidos360-users:
        condition: service_started
      ms-pedidos360-catalog:
        condition: service_started
      ms-pedidos360-orders:
        condition: service_started
      ms-pedidos360-messaging-admin:
        condition: service_started
    environment:
      USERS_URL: http://ms-pedidos360-users:8083
      CATALOG_URL: http://ms-pedidos360-catalog:8081
      ORDERS_URL: http://ms-pedidos360-orders:8082
      BFF_PUBLIC_BASE: ${BFF_PUBLIC_BASE:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?se requiere JWT_SECRET}
      MESSAGING_ADMIN_URL: ${MESSAGING_ADMIN_URL:-http://ms-pedidos360-messaging-admin:8084}
      KAFKA_ADMIN_URL: ${KAFKA_ADMIN_URL:-http://ms-pedidos360-messaging-admin:8084}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./FRONTEND
    container_name: pedidos360-frontend
    depends_on:
      - ms-pedidos360-bff
    environment:
      # Proxy Vite para /api y /oauth2 → gateway público (flujo AWS). Para
      # volver al flujo local: VITE_BFF_URL=http://ms-pedidos360-bff:8080
      VITE_BFF_URL: ${VITE_BFF_URL:-http://ms-pedidos360-bff:8080}
      # URL pública del BFF que ve el navegador (login OAuth con URL absoluta).
      # Gateway AWS (flujo de deployment):
      #   VITE_PUBLIC_BFF_URL=https://821dbjhp16.execute-api.us-east-1.amazonaws.com/prod
      # Local (sin gateway): http://localhost:8080
      VITE_PUBLIC_BFF_URL: ${VITE_PUBLIC_BFF_URL:-http://localhost:8080}
    ports:
      - "4200:4200"

volumes:
  pgdata:
  rabbitmq-node1-data:
  rabbitmq-node2-data:
  zookeeper-1-data:
  zookeeper-1-log:
  zookeeper-2-data:
  zookeeper-2-log:
  zookeeper-3-data:
  zookeeper-3-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:


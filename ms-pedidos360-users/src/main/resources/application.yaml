server:
  port: ${PORT:8083}
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: ${AZURE_REDIRECT_URI}
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
            user-name-attribute: sub
          google:
            issuer-uri: https://accounts.google.com
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

frontend:
  base-url: ${SPA_BASE_URL:http://localhost:4200}

# App Roles de Microsoft Entra ID -> rol interno.
# Azure emite en el claim "roles" el VALUE del app role (p.ej. "OPERADOR").
# También se aceptan GUIDs si defines AZURE_ROLE_*_ID con ellos.
azure:
  admin:
    - ${AZURE_ROLE_ADMIN_ID:ADMIN}
  operador:
    - ${AZURE_ROLE_OPERADOR_ID:OPERADOR}
  cliente:
    - ${AZURE_ROLE_CLIENTE_ID:CLIENTE}
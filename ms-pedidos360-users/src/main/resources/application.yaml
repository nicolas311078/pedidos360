server:
  port: ${PORT:8083}
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK/NACK explicito en cada consumidor.
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
        # No Romper el arranque si RabbitMQ aun no esta listo.
        missing-queues-fatal: false
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: ${AZURE_REDIRECT_URI}
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
            user-name-attribute: sub
          google:
            issuer-uri: https://accounts.google.com
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

frontend:
  base-url: ${SPA_BASE_URL:http://localhost:4200}

# App Roles de Microsoft Entra ID -> rol interno.
# Azure emite en el claim "roles" el VALUE del app role (p.ej. "OPERADOR").
# También se aceptan GUIDs si defines AZURE_ROLE_*_ID con ellos.
azure:
  admin:
    - ${AZURE_ROLE_ADMIN_ID:ADMIN}
  operador:
    - ${AZURE_ROLE_OPERADOR_ID:OPERADOR}
  cliente:
    - ${AZURE_ROLE_CLIENTE_ID:CLIENTE}

# --- Topologia de RabbitMQ (EP3) -------------------------------------------
# Nombres centralizados de exchanges, colas, routing keys y DLQ.
# Este servicio consume dos colas: notificaciones (exchange direct) y
# auditoria (exchange topic).
messaging:
  exchanges:
    direct: pedidos.direct
    topic: pedidos.topic
    deadLetter: pedidos.dlx
  # quorum = cola replicada en los dos nodos del cluster.
  queueType: quorum
  queues:
    notifications:
      name: notificaciones.pedidos
      exchange: direct
      routingKey: pedido.creado
      deadLetterQueue: notificaciones.pedidos.dlq
    audit:
      name: auditoria.pedidos
      exchange: topic
      routingKey: pedido.creado
      deadLetterQueue: auditoria.pedidos.dlq
  dlq-monitor:
    # true: registra en logs los mensajes de la DLQ y los libera.
    # false: los deja retenidos para inspeccion manual en la consola de RabbitMQ.
    enabled: ${MESSAGING_DLQ_MONITOR_ENABLED:true}
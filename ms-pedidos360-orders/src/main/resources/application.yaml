server:
  port: ${PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK/NACK explicito en cada consumidor (ver TicketConsumer).
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
        # No Romper el arranque si RabbitMQ aun no esta listo.
        missing-queues-fatal: false

catalog:
  url: ${CATALOG_URL:http://localhost:8081}

# --- Topologia de RabbitMQ (EP3) -------------------------------------------
# Nombres centralizados de exchanges, colas, routing keys y DLQ.
messaging:
  exchanges:
    direct: pedidos.direct
    topic: pedidos.topic
    deadLetter: pedidos.dlx
  # quorum = cola replicada en los dos nodos del cluster.
  queueType: quorum
  queues:
    tickets:
      name: tickets.pedidos
      exchange: topic
      routingKey: pedido.estado.actualizado
      deadLetterQueue: tickets.pedidos.dlq
  routingKeys:
    orderCreated: pedido.creado
    orderStatusChanged: pedido.estado.actualizado
  dlq-monitor:
    # true: registra en logs los mensajes de la DLQ y los libera.
    # false: los deja retenidos para inspeccion manual en la consola de RabbitMQ.
    enabled: ${MESSAGING_DLQ_MONITOR_ENABLED:true}

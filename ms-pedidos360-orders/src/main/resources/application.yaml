server:
  port: ${PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK/NACK explicito en cada consumidor (ver TicketConsumer).
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
        # No Romper el arranque si RabbitMQ aun no esta listo.
        missing-queues-fatal: false
  # --- Kafka (EP5) ----------------------------------------------------------
  # El productor publica los mismos DTO que RabbitMQ, con StringSerializer
  # para usar el ObjectMapper (tools.jackson) que ya usa el microservicio.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        retries: 3
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_CREATED_GROUP:pedidos-created-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

catalog:
  url: ${CATALOG_URL:http://localhost:8081}

# --- Topologia de RabbitMQ (EP3) -------------------------------------------
# Nombres centralizados de exchanges, colas, routing keys y DLQ.
messaging:
  exchanges:
    direct: pedidos.direct
    topic: pedidos.topic
    deadLetter: pedidos.dlx
  # quorum = cola replicada en los dos nodos del cluster.
  queueType: quorum
  queues:
    tickets:
      name: tickets.pedidos
      exchange: topic
      routingKey: pedido.estado.actualizado
      deadLetterQueue: tickets.pedidos.dlq
  routingKeys:
    orderCreated: pedido.creado
    orderStatusChanged: pedido.estado.actualizado
  dlq-monitor:
    # true: registra en logs los mensajes de la DLQ y los libera.
    # false: los deja retenidos para inspeccion manual en la consola de RabbitMQ.
    enabled: ${MESSAGING_DLQ_MONITOR_ENABLED:true}

# --- Tópicos y parámetros de administración de Kafka (EP5) -----------------
# Clave raíz (sin indentar): NO confundir con spring.kafka.
kafka:
  topics:
    created: ${KAFKA_CREATED_TOPIC:pedidos.creados.v1}
    status: ${KAFKA_STATUS_TOPIC:pedidos.estados.v1}
  partitions: ${KAFKA_PARTITIONS:3}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  retention-ms: ${KAFKA_RETENTION_MS:604800000}
  cleanup-policy: ${KAFKA_CLEANUP_POLICY:delete}
  load-test:
    enabled: ${KAFKA_LOAD_TEST_ENABLED:false}
    topic: ${KAFKA_LOAD_TEST_TOPIC:demo-estres-topic}
    max-messages: 2000

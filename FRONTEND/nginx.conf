server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: fallback a index.html para las rutas del router (/login, /catalog, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets con hash (build de Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}